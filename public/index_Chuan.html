<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Trợ lý Kiểm lâm</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👮</text></svg>">
    
    <style>
        /* 🚀 THIẾT KẾ NÚT TẢI MẪU: Chuyên nghiệp và Hiện đại */
        .download-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #28a745 0%, #1e7e34 100%);
            color: white !important;
            padding: 8px 18px; 
            margin: 10px 0;
            border-radius: 25px;
            text-decoration: none !important;
            font-weight: 600;
            font-size: 0.9em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
            border: none;
            line-height: 1.2;
        }

        .download-link::before {
            content: "📥"; 
            margin-right: 8px;
            font-size: 1.1em;
        }

        .download-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            filter: brightness(1.1);
        }

        /* 🔔 POP-UP THÔNG BÁO DỰNG SẴN */
        .pop-notification {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 9999;
            animation: fadeInOut 3.5s forwards;
            white-space: nowrap;
            pointer-events: none;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, 0); }
            15% { opacity: 1; transform: translate(-50%, -50%); }
            85% { opacity: 1; transform: translate(-50%, -50%); }
            100% { opacity: 0; transform: translate(-50%, -80%); }
        }

        /* 📱 FIX TRÀN VIỀN MOBILE */
        @media (max-width: 600px) {
            #controls {
                padding-bottom: env(safe-area-inset-bottom, 15px);
            }
            .msg { max-width: 92%; }
        }
    </style>
</head>
<body>

<div id="chatbox" class="domain-all">
    <div id="header">
        👮 TRỢ LÝ ẢO - KIỂM LÂM ĐỒNG THÁP
        <span class="info-icon" title="Thông tin tác giả">🎖️</span>
    </div>

    <div id="category-menu">
        <button class="cat-btn active" onclick="setDomain('all')">🏠 Tổng hợp</button>
        <button class="cat-btn" onclick="setDomain('thu_tuc')">📄 Thủ tục</button>
        <button class="cat-btn" onclick="setDomain('xu_phat')">⚖️ Xử phạt</button>
        <button class="cat-btn" onclick="setDomain('du_lieu')">📊 Số liệu</button>
        <button class="cat-btn" onclick="setDomain('extra_1')">📍 Bản đồ</button>
        <button class="cat-btn" onclick="setDomain('extra_2')">🎤 Ghi âm</button>
        <button class="cat-btn" onclick="setDomain('extra_3')">📥 Xuất file</button>
        <button class="cat-btn" onclick="setDomain('extra_4')">⭐ Đánh giá</button>
    </div>
    
    <div id="messages">
        <div class="msg bot">🌲 Hệ thống Trợ lý Kiểm lâm đã sẵn sàng hỗ trợ Anh/Chị.</div>
    </div>
    
    <div id="controls">
        <input type="text" id="input" placeholder="Nhập nội dung cần hỗ trợ..." autocomplete="off">
        <button id="sendBtn">Gửi</button>
    </div>
</div>

<script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    let currentDomain = 'all';

    window.onload = () => {
        showPopNotification("Xin chào! Hãy chọn chế độ để bắt đầu.");
    };

    function showPopNotification(text) {
        const oldPop = document.querySelector(".pop-notification");
        if (oldPop) oldPop.remove();

        const pop = document.createElement("div");
        pop.className = "pop-notification";
        pop.innerHTML = `🔔 ${text}`;
        document.getElementById("chatbox").appendChild(pop);
        setTimeout(() => { if (pop) pop.remove(); }, 3500); 
    }

    function setDomain(domain) {
        currentDomain = domain;
        document.getElementById("chatbox").className = "domain-" + domain; 

        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText.toLowerCase().includes(getDomainLabel(domain).toLowerCase())) {
                btn.classList.add('active');
            }
        });

        messages.innerHTML = ""; 
        const welcomeMsgs = {
            'all': '🌲 Hệ thống Trợ lý Kiểm lâm đã sẵn sàng hỗ trợ ở chế độ Tổng hợp.',
            'thu_tuc': '📄 Chuyên gia Thủ tục hành chính đã sẵn sàng hỗ trợ Anh/Chị.',
            'xu_phat': '⚖️ Chế độ tra cứu Xử phạt vi phạm đã sẵn sàng hỗ trợ Anh/Chị.',
            'du_lieu': '📊 Hệ thống dữ liệu rừng đã sẵn sàng cung cấp số liệu.',
            'extra_1': '📍 Bản đồ lâm nghiệp số đã sẵn sàng hiển thị.',
            'extra_2': '🎤 Trợ lý giọng nói đang lắng nghe Anh/Chị.',
            'extra_3': '📥 Hệ thống xuất báo cáo đã sẵn sàng.',
            'extra_4': '⭐ Anh/Chị vui lòng để lại đánh giá về dịch vụ.'
        };
        
        showPopNotification(`Đã chuyển sang: ${getDomainLabel(domain)}`);
        addMessage("bot", welcomeMsgs[domain]); 
        messages.scrollTop = 0;
    }

    function getDomainLabel(domain) {
        const labels = { 'all':'TỔNG HỢP', 'thu_tuc':'THỦ TỤC', 'xu_phat':'XỬ PHẠT', 'du_lieu':'SỐ LIỆU', 'extra_1':'BẢN ĐỒ', 'extra_2':'GIỌNG NÓI', 'extra_3':'XUẤT FILE', 'extra_4':'ĐÁNH GIÁ' };
        return labels[domain];
    }

    function addMessage(sender, text, choices = []) {
        const div = document.createElement("div");
        div.className = "msg " + sender;
        messages.appendChild(div);

        if (sender === "bot") {
            let formattedText = text
                .replace(/\n/g, "<br>")
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="download-link">$1</a>');
            
            let i = 0;
            let speed = 10; 
            div.innerHTML = `<span class="loading-dots">Đang truy xuất dữ liệu...</span>`;

            setTimeout(() => {
                div.innerHTML = ""; 
                function typeWriter() {
                    if (i < formattedText.length) {
                        if (formattedText.charAt(i) === '<') {
                            let endTag = formattedText.indexOf('>', i);
                            div.innerHTML += formattedText.substring(i, endTag + 1);
                            i = endTag + 1;
                        } else {
                            div.innerHTML += formattedText.charAt(i);
                            i++;
                        }
                        messages.scrollTop = messages.scrollHeight;
                        setTimeout(typeWriter, speed);
                    } else {
                        showChoices(choices);
                    }
                }
                typeWriter();
            }, 600);
        } else {
            div.innerText = text;
            showChoices(choices);
        }
    }

    function showChoices(choices) {
        if (choices && choices.length > 0) {
            const choiceContainer = document.createElement("div");
            choiceContainer.className = "choices-container";
            choices.forEach(txt => {
                const btn = document.createElement("button");
                btn.className = "choice-btn";
                btn.innerText = txt;
                btn.onclick = () => { input.value = txt; send(); };
                choiceContainer.appendChild(btn);
            });
            messages.appendChild(choiceContainer);
            messages.scrollTop = messages.scrollHeight;
        }
    }

    async function send() {
        const text = input.value.trim();
        if (!text) return;

        addMessage("user", text); 
        input.value = "";

        const thinkingDiv = document.createElement("div");
        thinkingDiv.className = "msg bot thinking";
        thinkingDiv.innerHTML = "Chờ một chút...";
        messages.appendChild(thinkingDiv);
        messages.scrollTop = messages.scrollHeight;

        try {
            const response = await fetch("https://chatbot-jqsw.onrender.com/api/chatbot", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ msg: text, domain: currentDomain })
            });
            const data = await response.json();
            thinkingDiv.remove();

            if (data.reply) {
                addMessage("bot", data.reply, data.choices); 
            }
        } catch (err) { 
            if (thinkingDiv) thinkingDiv.remove();
            addMessage("bot", "⚠️ Lỗi kết nối máy chủ.");
        }
    }

    sendBtn.onclick = send;
    input.onkeypress = (e) => { if(e.key === 'Enter') send(); };
</script>
</body>
</html>

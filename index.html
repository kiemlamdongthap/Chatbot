<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trợ lý Kiểm lâm</title>
    
    <link rel="stylesheet" href="public/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👮</text></svg>">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/Chatbot/sw.js')
            .then(reg => console.log('PWA: Service Worker đã sẵn sàng!'))
            .catch(err => console.log('PWA: Lỗi registration:', err));
        });
      }
    </script>

    <style>
        /* CSS bổ sung để giao diện giống App hơn */
        body {
            overscroll-behavior-y: contain; /* Ngăn chặn kéo refresh trên trình duyệt mobile */
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        #chatbox {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Cuộn mượt trên iOS */
        }

        .download-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white !important;
            padding: 8px 18px; 
            margin: 10px 0;
            border-radius: 20px; /* Bo tròn kiểu hiện đại */
            text-decoration: none !important;
            font-weight: 600;
            font-size: 0.9em;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

<div id="chatbox" class="domain-all">
    <div id="header">
        👮 TRỢ LÝ ẢO - KIỂM LÂM ĐỒNG THÁP<span class="info-icon">🎖️</span>
    </div>

    <div id="category-menu">
        <button class="cat-btn active" onclick="setDomain('all')">🏠 Tổng hợp</button>
        <button class="cat-btn" onclick="setDomain('thu_tuc')">📄 Thủ tục</button>
        <button class="cat-btn" onclick="setDomain('xu_phat')">⚖️ Xử phạt</button>
        <button class="cat-btn" onclick="setDomain('du_lieu')">📊 Số liệu</button>
        <button class="cat-btn" onclick="setDomain('extra_1')">📍 Bản đồ</button>
        <button class="cat-btn" onclick="setDomain('extra_2')">🎤 Ghi âm</button>
        <button class="cat-btn" onclick="setDomain('extra_3')">📥 Xuất file</button>
        <button class="cat-btn" onclick="setDomain('extra_4')">⭐ Đánh giá</button>
    </div>
    
    <div id="messages">
        <div class="msg bot">🌲 Hệ thống Trợ lý Kiểm lâm đã sẵn sàng hỗ trợ Anh/Chị.</div>
    </div>
    
    <div id="controls">
        <input type="text" id="input" placeholder="Nhập nội dung cần hỗ trợ..." autocomplete="off">
        <button id="sendBtn">Gửi</button>
    </div>
</div>

<script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    let currentDomain = 'all';

    window.onload = () => {
        showPopNotification("Xin chào! Hãy chọn chế độ để bắt đầu.");
    };

    function showPopNotification(text) {
        const oldPop = document.querySelector(".pop-notification");
        if (oldPop) oldPop.remove();
        const pop = document.createElement("div");
        pop.className = "pop-notification";
        pop.innerHTML = `🔔 ${text}`;
        document.getElementById("chatbox").appendChild(pop);
        setTimeout(() => { if (pop) pop.remove(); }, 3500); 
    }

    function setDomain(domain) {
        currentDomain = domain;
        document.getElementById("chatbox").className = "domain-" + domain; 
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.getAttribute('onclick').includes(`'${domain}'`)) btn.classList.add('active');
        });
        messages.innerHTML = ""; 
        const welcomeMsgs = {
            'all': '🌲 Hệ thống Trợ lý Kiểm lâm đã sẵn sàng hỗ trợ Anh/Chị ở chế độ Tổng hợp.',
            'thu_tuc': '📄 Chuyên gia Thủ tục hành chính đã sẵn sàng hỗ trợ Anh/Chị.',
            'xu_phat': '⚖️ Chế độ tra cứu Xử phạt vi phạm đã sẵn sàng hỗ trợ Anh/Chị.',
            'du_lieu': '📊 Hệ thống dữ liệu rừng đã sẵn sàng cung cấp số liệu cho Anh/Chị.',
            'extra_1': '📍 Bản đồ lâm nghiệp số đã sẵn sàng hiển thị.',
            'extra_2': '🎤 Trợ lý giọng nói đang lắng nghe Anh/Chị.',
            'extra_3': '📥 Hệ thống xuất báo cáo đã sẵn sàng.',
            'extra_4': '⭐ Anh/Chị vui lòng để lại đánh giá về dịch vụ.'
        };
        const labels = { 'all':'TỔNG HỢP', 'thu_tuc':'THỦ TỤC', 'xu_phat':'XỬ PHẠT', 'du_lieu':'SỐ LIỆU', 'extra_1':'BẢN ĐỒ', 'extra_2':'GIỌNG NÓI', 'extra_3':'XUẤT FILE', 'extra_4':'ĐÁNH GIÁ' };
        showPopNotification(`Đã chuyển sang: ${labels[domain]}`);
        addMessage("bot", welcomeMsgs[domain]); 
        messages.scrollTop = 0;
    }

function addMessage(sender, text, choices = []) {
    const div = document.createElement("div");
    div.className = "msg " + sender;
    messages.appendChild(div);

    if (sender === "bot") {
        // 🟢 Cập nhật Regex: Tự động thêm 'public/' vào các link file nội bộ (không bắt đầu bằng http)
        let formattedText = text
    .replace(/\n/g, "<br>")
    // Tự động nhận diện file và gắn link GitHub Pages thay vì localhost
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, fileName) => {
        const fileUrl = fileName.startsWith('http') 
            ? fileName 
            : `https://kiemlamdongthap.github.io/Chatbot/public/forms/${fileName}`;
        return `<a href="${fileUrl}" target="_blank" class="download-link">${label}</a>`;
    });
        
        let i = 0;
        let speed = 5; 

        div.innerHTML = `<span class="loading-dots">Đang truy xuất dữ liệu...</span>`;

        setTimeout(() => {
            div.innerHTML = ""; 
            function typeWriter() {
                if (i < formattedText.length) {
                    if (formattedText.charAt(i) === '<') {
                        let endTag = formattedText.indexOf('>', i);
                        if (endTag !== -1) {
                            div.innerHTML += formattedText.substring(i, endTag + 1);
                            i = endTag + 1;
                        } else {
                            div.innerHTML += formattedText.charAt(i);
                            i++;
                        }
                    } else {
                        div.innerHTML += formattedText.charAt(i);
                        i++;
                    }
                    messages.scrollTop = messages.scrollHeight;
                    setTimeout(typeWriter, speed);
                } else {
                    showChoices(choices);
                }
            }
            typeWriter();
        }, 400); 
    } else {
        div.innerText = text;
        showChoices(choices);
    }
}

function showChoices(choices) {
    if (choices && choices.length > 0) {
        const choiceContainer = document.createElement("div");
        choiceContainer.className = "choices-container";
        choices.forEach(txt => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = txt;
            btn.onclick = () => { input.value = txt; send(); };
            choiceContainer.appendChild(btn);
        });
        messages.appendChild(choiceContainer);
        messages.scrollTop = messages.scrollHeight;
    }
}

async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMessage("user", text); 
    input.value = "";

    const thinkingDiv = document.createElement("div");
    thinkingDiv.className = "msg thinking";
    thinkingDiv.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
    messages.appendChild(thinkingDiv);
    messages.scrollTop = messages.scrollHeight;

    try {
        // 🟢 Link Render của bạn
        const response = await fetch("https://chatbot-jqsw.onrender.com/api/chatbot", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ msg: text, domain: currentDomain })
        });
        const data = await response.json();
        thinkingDiv.remove();

        if (data.reply) {
            addMessage("bot", data.reply, data.choices); 
        }
        
    } catch (err) { 
        if (thinkingDiv) thinkingDiv.remove();
        console.error(err);
        addMessage("bot", "⚠️ Lỗi kết nối máy chủ.");
    }
}

    sendBtn.onclick = send;
    input.onkeypress = (e) => { if(e.key === 'Enter') send(); };
</script>
</body>
</html>

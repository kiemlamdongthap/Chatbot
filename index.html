<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Trợ lý Kiểm lâm Đồng Tháp</title>
    
    <link rel="stylesheet" href="public/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👮</text></svg>">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* CSS bổ sung để UI sinh động hơn */
        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; overscroll-behavior-y: contain;
        }

        /* Hiệu ứng focus cho khung nhập liệu */
        #controls {
            padding: 12px;
            background: white;
            border-top: 1px solid #eee;
            display: flex; gap: 10px;
        }
        
        #input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #f0f0f0;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s ease;
        }

        #input:focus {
            border-color: var(--current-color, #2e7d32);
            box-shadow: 0 0 8px rgba(46, 125, 50, 0.1);
        }

        /* Tối ưu Modal Tác giả */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white; padding: 25px; border-radius: 20px;
            width: 90%; max-width: 380px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: modalShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalShow {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute; top: 15px; right: 20px;
            font-size: 28px; cursor: pointer; color: #aaa;
        }

        .modal-header {
            font-size: 20px; font-weight: 800; margin-bottom: 20px;
            color: #2e7d32; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;
        }

        .modal-body p { margin: 12px 0; color: #444; }
        
        /* Hiệu ứng nhịp tim cho icon huy chương */
        .info-icon { 
            cursor: pointer; margin-left: 8px; display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.2); }
            28% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div id="chatbox" class="domain-all">
    <div id="header">
    <span class="header-title">👮 TRỢ LÝ ẢO - KIỂM LÂM ĐỒNG THÁP</span>
    <div class="medal-pulse-ring" id="infoBtn">
        <span class="info-icon">🎖️</span>
    </div>
</div>

    <div id="category-menu">
        <button class="cat-btn active" data-domain="all">🏠 Tổng hợp</button>
        <button class="cat-btn" data-domain="thu_tuc">📄 Thủ tục</button>
        <button class="cat-btn" data-domain="xu_phat">⚖️ Xử phạt</button>
        <button class="cat-btn" data-domain="du_lieu">📊 Số liệu</button>
        <button class="cat-btn" data-domain="extra_1">📍 Chủ rừng</button>
        <button class="cat-btn" data-domain="extra_2">🎤 Ghi âm</button>
        <button class="cat-btn" data-domain="extra_3">📥 Xuất file</button>
        <button class="cat-btn" data-domain="extra_4">⭐ Đánh giá</button>
    </div>
    
    <div id="messages">
        <div class="msg bot">🌲 Hệ thống Trợ lý Kiểm lâm đã sẵn sàng hỗ trợ Anh/Chị.</div>
    </div>
    
    <div id="controls">
        <input type="text" id="input" placeholder="Nhập nội dung cần hỗ trợ..." autocomplete="off">
        <button id="sendBtn">Gửi</button>
    </div>
</div>

<div id="authorModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-modal" id="closeModal">&times;</span>
        <div class="modal-header">🏅 Thông tin tác giả</div>
        <div class="modal-body">
            <p><strong>Nguyễn Văn Phúc</strong></p>
            <p><strong>Hotline:</strong> <a href="tel:0358758358" style="text-decoration:none; color:inherit;">0358.758.358</a></p>
            <p><strong>Email:</strong> Phuc88.klvn@gmail.com</p>
            <p><strong>Đơn vị:</strong> Chi cục Kiểm lâm tỉnh Đồng Tháp</p>
            <p style="font-size: 11px; color: #888; text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                © 2026 Trợ lý ảo Kiểm lâm Đồng Tháp • <b>Version 1.0.0</b>
            </p>
        </div>
    </div>
</div>

<script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtnEl = document.getElementById("sendBtn");
    const chatboxEl = document.getElementById("chatbox");
    let currentDomain = 'all';
    let isBotTyping = false;

    // --- QUẢN LÝ MODAL ---
    const toggleModal = () => {
        const modal = document.getElementById("authorModal");
        modal.style.display = (modal.style.display === "flex") ? "none" : "flex";
    };
    document.getElementById("infoBtn").onclick = toggleModal;
    document.getElementById("closeModal").onclick = toggleModal;
    
    // Đóng modal khi click ra ngoài vùng trắng
    window.onclick = (e) => {
        const modal = document.getElementById("authorModal");
        if (e.target === modal) toggleModal();
    };

    // --- HIỆU ỨNG & CHUYỂN CHẾ ĐỘ ---
    function applyClickAnimation(element, animationClass = 'animate-shake') {
        element.classList.add(animationClass);
        setTimeout(() => element.classList.remove(animationClass), 400);
    }

    document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.onclick = () => {
            const domain = btn.dataset.domain;
            if (currentDomain === domain) return;
            applyClickAnimation(btn);
            currentDomain = domain;
            chatboxEl.className = "domain-" + domain;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            messagesEl.innerHTML = "";
            
            const labels = { 'all':'TỔNG HỢP', 'thu_tuc':'THỦ TỤC', 'xu_phat':'XỬ PHẠT', 'du_lieu':'SỐ LIỆU', 'extra_1':'BẢN ĐỒ', 'extra_2':'GIỌNG NÓI', 'extra_3':'XUẤT FILE', 'extra_4':'ĐÁNH GIÁ' };
            showPopNotification(`Đã chuyển sang: ${labels[domain]}`);
            
            const welcomeMsgs = {
                'all': '🌲 Chế độ Tổng hợp đã sẵn sàng.',
                'thu_tuc': '📄 Chuyên gia Thủ tục hành chính sẵn sàng.',
                'xu_phat': '⚖️ Tra cứu Xử phạt đã sẵn sàng.',
                'du_lieu': '📊 Hệ thống dữ liệu rừng sẵn sàng.',
                'extra_1': '📍 Thông tin về các Đơn vị quản lý rừng Đồng Tháp.',
                'extra_2': '🎤 Trợ lý giọng nói đang lắng nghe.',
                'extra_3': '📥 Xuất báo cáo đã sẵn sàng.',
                'extra_4': '⭐ Vui lòng để lại đánh giá.'
            };
            addMessage("bot", welcomeMsgs[domain]);
        };
    });

    // --- XỬ LÝ TIN NHẮN ---
    function addMessage(sender, text, choices = []) {
        const div = document.createElement("div");
        div.className = "msg " + sender;
        
        if (sender === "bot") {
            isBotTyping = true;
            let formattedText = text.replace(/\n/g, "<br>")
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, fileName) => {
                    const fileUrl = fileName.startsWith('http') ? fileName : `https://kiemlamdongthap.github.io/Chatbot/public/forms/${fileName}`;
                    return `<a href="${fileUrl}" target="_blank" class="download-link">${label}</a>`;
                });
            
            div.innerHTML = `<span class="loading-dots">Đang xử lý...</span>`;
            messagesEl.appendChild(div);

            setTimeout(() => {
                div.innerHTML = "";
                let i = 0;
                const typewriter = setInterval(() => {
                    if (i < formattedText.length) {
                        if (formattedText[i] === '<') {
                            let endTag = formattedText.indexOf('>', i);
                            div.innerHTML += formattedText.substring(i, endTag + 1);
                            i = endTag + 1;
                        } else {
                            div.innerHTML += formattedText[i];
                            i++;
                        }
                        messagesEl.scrollTop = messagesEl.scrollHeight;
                    } else {
                        clearInterval(typewriter);
                        isBotTyping = false;
                        showChoices(choices);
                    }
                }, 10);
            }, 500);
        } else {
            div.innerText = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    }

    function showChoices(choices) {
        if (!choices || choices.length === 0) return;
        const container = document.createElement("div");
        container.className = "choices-container";
        choices.forEach(txt => {
            const btn = document.createElement("button");
            btn.className = "choice-btn";
            btn.innerText = txt;
            btn.onclick = () => { 
                if(!isBotTyping) { 
                    applyClickAnimation(btn, 'animate-bounce');
                    inputEl.value = txt; 
                    send(); 
                } 
            };
            container.appendChild(btn);
        });
        messagesEl.appendChild(container);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function send() {
        const text = inputEl.value.trim();
        if (!text || isBotTyping) return;

        addMessage("user", text);
        inputEl.value = "";
        
        const thinking = document.createElement("div");
        thinking.className = "msg thinking";
        thinking.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
        messagesEl.appendChild(thinking);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        const API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
            ? "http://localhost:10000/api/chatbot" 
            : "https://chatbot-jqsw.onrender.com/api/chatbot";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ msg: text, domain: currentDomain })
            });
            const data = await response.json();
            thinking.remove();
            if (data.reply) addMessage("bot", data.reply, data.choices);
        } catch (err) {
            thinking.remove();
            addMessage("bot", "⚠️ Lỗi kết nối máy chủ. Vui lòng thử lại sau.");
        }
    }

    function showPopNotification(text) {
        document.querySelectorAll(".pop-notification").forEach(n => n.remove());
        const pop = document.createElement("div");
        pop.className = "pop-notification";
        pop.innerHTML = `🔔 ${text}`;
        chatboxEl.appendChild(pop);
        setTimeout(() => pop?.remove(), 3000); 
    }

    sendBtnEl.onclick = send;
    inputEl.onkeypress = (e) => { if(e.key === 'Enter') send(); };
    window.onload = () => showPopNotification("Hệ thống đã sẵn sàng!");
</script>

</body>
</html>

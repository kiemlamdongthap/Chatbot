<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="KiểmLâm ĐT">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Trợ lý Kiểm lâm Đồng Tháp</title>
    
    <link rel="stylesheet" href="public/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👮</text></svg>">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        /* CSS bổ sung để UI sinh động hơn */
        body {
            margin: 0; padding: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden; overscroll-behavior-y: contain;
        }

        /* Hiệu ứng focus cho khung nhập liệu */
        #controls {
            padding: 12px;
            background: white;
            border-top: 1px solid #eee;
            display: flex; gap: 10px;
        }
        
        #input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #f0f0f0;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s ease;
        }

        #input:focus {
            border-color: var(--current-color, #2e7d32);
            box-shadow: 0 0 8px rgba(46, 125, 50, 0.1);
        }

        /* Tối ưu Modal Tác giả */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 1000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white; padding: 25px; border-radius: 20px;
            width: 90%; max-width: 380px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: modalShow 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalShow {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-modal {
            position: absolute; top: 15px; right: 20px;
            font-size: 28px; cursor: pointer; color: #aaa;
        }

        .modal-header {
            font-size: 20px; font-weight: 800; margin-bottom: 20px;
            color: #2e7d32; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px;
        }

        .modal-body p { margin: 12px 0; color: #444; }
        
        /* Hiệu ứng nhịp tim cho icon huy chương */
        .info-icon { 
            cursor: pointer; margin-left: 8px; display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.2); }
            28% { transform: scale(1); }
		
        }
    </style>
</head>
<body>

<div id="chatbox" class="domain-all">
    <div id="header">
    <span class="header-title">👮 TRỢ LÝ ẢO - KIỂM LÂM ĐỒNG THÁP</span>
    <div class="medal-pulse-ring" id="infoBtn">
        <span class="info-icon">🎖️</span>
    </div>
</div>

    <div id="category-menu">
        <button class="cat-btn active" data-domain="all">🏠 Tổng hợp</button>
        <button class="cat-btn" data-domain="thu_tuc">📄 Thủ tục hành chính</button>
        <button class="cat-btn" data-domain="xu_phat">⚖️ Vi phạm hành chính</button>
        <button class="cat-btn" data-domain="du_lieu">📊 Thông tin địa phương</button>
        <button class="cat-btn" data-domain="chu_rung">📍 Đơn vị chủ rừng</button>
        <button class="cat-btn" data-domain="hotline">🔥 Hotline báo cháy</button>
        <button class="cat-btn" data-domain="extra_3">📥 Xuất file</button>
        <button class="cat-btn" data-domain="extra_4">⭐ Đánh giá</button>
    </div>
    
    <div id="messages">
        <div class="msg bot">🌲 Hệ thống Trợ lý Kiểm lâm đã sẵn sàng hỗ trợ Anh/Chị.</div>
    </div>
    
    <div id="controls">
        <input type="text" id="input" placeholder="Nhập nội dung cần hỗ trợ..." autocomplete="off">
        <button id="sendBtn">Gửi</button>
    </div>
</div>

<div id="authorModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-modal" id="closeModal">&times;</span>
        <div class="modal-header">🏅 Thông tin tác giả</div>
        <div class="modal-body">
            <p><strong>Nguyễn Văn Phúc</strong></p>
            <p><strong>Hotline:</strong> <a href="tel:0358758358" style="text-decoration:none; color:inherit;">0358.758.358</a></p>
            <p><strong>Email:</strong> Phuc88.klvn@gmail.com</p>
            <p><strong>Đơn vị:</strong> Chi cục Kiểm lâm tỉnh Đồng Tháp</p>
            <p style="font-size: 11px; color: #888; text-align: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                © 2026 Trợ lý ảo Kiểm lâm Đồng Tháp • <b>Version 1.0.0</b>
            </p>
        </div>
    </div>
</div>

<script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtnEl = document.getElementById("sendBtn");
    const chatboxEl = document.getElementById("chatbox");
    let currentDomain = 'all';
    let isBotTyping = false;

    // --- 1. CHỨC NĂNG KÉO TRƯỢT (Dùng chung cho Menu và Bot Choices) ---
    function initDragToScroll(el) {
        if (!el) return;
        let isDown = false;
        let startX;
        let scrollLeft;
        let isDragging = false;

        el.addEventListener('mousedown', (e) => {
            isDown = true;
            isDragging = false;
            el.classList.add('active');
            startX = e.pageX - el.offsetLeft;
            scrollLeft = el.scrollLeft;
        });

        el.addEventListener('mouseleave', () => { isDown = false; el.classList.remove('active'); });
        el.addEventListener('mouseup', () => { isDown = false; el.classList.remove('active'); });

        el.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            const x = e.pageX - el.offsetLeft;
            const walk = (x - startX) * 2; 
            if (Math.abs(x - startX) > 5) {
                isDragging = true;
                e.preventDefault();
                el.scrollLeft = scrollLeft - walk;
            }
        });

        el.addEventListener('click', (e) => {
            if (isDragging) {
                e.preventDefault();
                e.stopImmediatePropagation();
            }
        }, true);
    }

    // --- 2. QUẢN LÝ MODAL TÁC GIẢ ---
    const toggleModal = () => {
        const modal = document.getElementById("authorModal");
        modal.style.display = (modal.style.display === "flex") ? "none" : "flex";
    };
    document.getElementById("infoBtn").onclick = toggleModal;
    document.getElementById("closeModal").onclick = toggleModal;
    window.onclick = (e) => {
        const modal = document.getElementById("authorModal");
        if (e.target === modal) toggleModal();
    };

    // --- HIỆU ỨNG & CHUYỂN CHẾ ĐỘ ---
function applyClickAnimation(element, animationClass = 'animate-shake') {
    element.classList.add(animationClass);
    setTimeout(() => element.classList.remove(animationClass), 400);
}

document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.onclick = () => {
        const domain = btn.dataset.domain;
        if (currentDomain === domain) return;

        applyClickAnimation(btn);
        currentDomain = domain;
        
        // Cập nhật giao diện chatbox theo domain
        chatboxEl.className = "domain-" + domain;
        
        // Quản lý class active cho nút
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Xóa tin nhắn cũ để làm sạch màn hình khi chuyển mục
        messagesEl.innerHTML = "";
        
        const labels = { 
            'all':'TỔNG HỢP', 
            'thu_tuc':'Hỗ trợ Thủ tục hành chính 📄', 
            'xu_phat':'Hỗ trợ Xử phạt vi phạm hành chính ⚖️', 
            'du_lieu':'Tra cứu Số liệu địa phương 📊', 
            'chu_rung':'Tra cứu Thông tin  đơn vị chủ rừng 📍', 
            'hotline':'Tra cứu Hotline báo cháy rừng 🔥', 
            'extra_3':'XUẤT FILE', 
            'extra_4':'Đánh giá, nhận xét của người dùng ✅' 
        };

        // CHỈ HIỆN THÔNG BÁO NẾU DOMAIN KHÔNG PHẢI LÀ 'ALL'
        // Việc này giúp tránh hiện thông báo "Tổng hợp" khi bạn đã ẩn nút này đi
        if (domain !== 'all' && labels[domain]) {
            showPopNotification(`Đã chuyển sang: ${labels[domain]}`);
        }
        
        const welcomeMsgs = {
            'all': '🌲 Chế độ Tổng hợp đã sẵn sàng.',
            'thu_tuc': '📄 Tôi có thể hỗ trợ, cung cấp cho Anh/Chị các thông tin cần thiết về Thủ tục hành chính lĩnh vực Lâm nghiệp và Kiểm lâm!',
            'xu_phat': '⚖️ Tôi có thể hỗ trợ, xác định, tra cứu thông tin việc Xử phạt vi phạm hành chính trong lĩnh vực Lâm nghiệp!',
            'du_lieu': '📊 Tôi có thể hỗ trợ, cung cấp cho Anh/Chị các thông tin về Lâm nghiệp tại các xã, phường!',
            'chu_rung': '📍 Tôi có thể hỗ trợ, cung cấp cho Anh/Chị các thông tin của các Đơn vị quản lý rừng!.',
            'hotline': '🚨 Khi cháy rừng, không biết báo ai. Tôi cung cấp thông tin để Anh/Chị báo cháy khẩn cấp.',
            'extra_3': '📥 Xuất báo cáo đã sẵn sàng.',
            'extra_4': '⭐ Trợ lý Kiểm lâm Đồng Tháp đang trong giai đoạn chạy thử nghiệm. Rất mong nhận được góp ý, đánh giá của Anh/Chị! Thông tin thêm hãy chọn 🏅 góc phải nhé!'
        };

        if (welcomeMsgs[domain]) {
            addMessage("bot", welcomeMsgs[domain]);
        }
    };
});

// --- LOGIC KHỞI TẠO (QUAN TRỌNG) ---
// Sau khi ẩn nút Tổng hợp, hãy giả lập click vào nút Thủ tục để hiện thông báo ngay từ đầu
document.addEventListener('DOMContentLoaded', () => {
    const defaultBtn = document.querySelector('.cat-btn[data-domain="thu_tuc"]');
    if (defaultBtn) {
        defaultBtn.click(); // Tự động kích hoạt thông báo "Đã chuyển sang: Hỗ trợ Thủ tục hành chính"
    }
});

    // --- 4. XỬ LÝ TIN NHẮN VÀ HIỆU ỨNG ĐÁNH MÁY ---
    function addMessage(sender, text, choices = []) {
        const div = document.createElement("div");
        div.className = "msg " + sender;
        
        if (sender === "bot") {
            isBotTyping = true;
            let formattedText = text.replace(/\n/g, "<br>");
            formattedText = formattedText.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (match, label, url) => {
                const isMap = url.toLowerCase().includes('google') || url.toLowerCase().includes('maps');
                const finalUrl = url.startsWith('http') ? url : `https://kiemlamdongthap.github.io/Chatbot/public/forms/${url}`;
                return `<a href="${finalUrl}" target="_blank" class="${isMap ? 'map-btn-final' : 'download-link'}">${isMap ? '📍 ' : ''}${label}</a>`;
            });
            
            div.innerHTML = `<span class="loading-dots">Đang xử lý...</span>`;
            messagesEl.appendChild(div);

            setTimeout(() => {
                if (formattedText.includes('<details')) {
                    div.innerHTML = formattedText;
                    isBotTyping = false;
                    showChoices(choices);
                } else {
                    div.innerHTML = "";
                    let i = 0;
                    const typewriter = setInterval(() => {
                        if (i < formattedText.length) {
                            if (formattedText[i] === '<') {
                                let endTag = formattedText.indexOf('>', i);
                                div.innerHTML += formattedText.substring(i, endTag + 1);
                                i = endTag + 1;
                            } else {
                                div.innerHTML += formattedText[i];
                                i++;
                            }
                            messagesEl.scrollTop = messagesEl.scrollHeight;
                        } else {
                            clearInterval(typewriter);
                            isBotTyping = false;
                            showChoices(choices);
                        }
                    }, 5); 
                }
            }, 300);
        } else {
            div.innerText = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
    }

    // --- 5. HIỂN THỊ CÁC NÚT BẤM LỰA CHỌN (Gắn tính năng trượt) ---
    function showChoices(choices) {
    if (!choices || choices.length === 0) return;
    const container = document.createElement("div");
    // SỬA TÊN CLASS TẠI ĐÂY ĐỂ ĂN THEO CSS THANH TRƯỢT NGANG
    container.className = "choices-wrapper"; 
    
    choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.className = "choice-btn";
        const isObject = typeof choice === 'object' && choice !== null;
        const displayLabel = isObject ? choice.text : choice;
        const hiddenValue = isObject ? choice.value : choice;

        btn.innerText = displayLabel; 
        btn.onclick = () => { 
            if(!isBotTyping) { 
                applyClickAnimation(btn, 'animate-bounce');
                inputEl.dataset.lastLabel = displayLabel; 
                inputEl.value = hiddenValue; 
                send(); 
            } 
        };
        container.appendChild(btn);
    });
    messagesEl.appendChild(container);
    
    // Đảm bảo cuộn xuống cuối sau khi thêm nút
    setTimeout(() => {
        messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' });
    }, 100);

    // Kích hoạt kéo trượt cho chính container vừa tạo
    initDragToScroll(container);
}

    // --- 6. GỬI TIN NHẮN LÊN SERVER ---
    async function send() {
        const text = inputEl.value.trim();
        if (!text || isBotTyping) return;
        const friendlyText = inputEl.dataset.lastLabel || text;
        
        addMessage("user", friendlyText);
        inputEl.value = "";
        delete inputEl.dataset.lastLabel;
        
        const thinking = document.createElement("div");
        thinking.className = "msg thinking";
        thinking.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
        messagesEl.appendChild(thinking);
        messagesEl.scrollTop = messagesEl.scrollHeight;

        const API_URL = (window.location.hostname.includes("localhost") || window.location.hostname.includes("127.0.0.1"))
            ? "http://localhost:10000/api/chatbot" 
            : "https://chatbot-jqsw.onrender.com/api/chatbot";

        try {
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
				credentials: "include",
                body: JSON.stringify({ msg: text, domain: currentDomain })
            });
            const data = await response.json();
            thinking.remove();
            if (data.reply) addMessage("bot", data.reply, data.choices);
        } catch (err) {
            thinking.remove();
            addMessage("bot", "⚠️ Lỗi kết nối máy chủ. Vui lòng thử lại sau.");
        }
    }

    function showPopNotification(text) {
        document.querySelectorAll(".pop-notification").forEach(n => n.remove());
        const pop = document.createElement("div");
        pop.className = "pop-notification";
        pop.innerHTML = `🔔 ${text}`;
        chatboxEl.appendChild(pop);
        setTimeout(() => pop?.remove(), 3000); 
    }

    sendBtnEl.onclick = send;
    inputEl.onkeypress = (e) => { if(e.key === 'Enter') send(); };

    // KHỞI TẠO KHI TẢI TRANG
    window.onload = () => {
        showPopNotification("Hệ thống đã sẵn sàng!");
        // Kích hoạt trượt cho menu danh mục chính
        initDragToScroll(document.getElementById('category-menu'));
    };
	// Hàm dùng chung cho mọi container cần trượt ngang
	function initDragToScroll(slider) {
    if (!slider) return;
    let isDown = false;
    let startX;
    let scrollLeft;
    let isDragging = false;

    slider.addEventListener('mousedown', (e) => {
        isDown = true;
        isDragging = false; 
        slider.classList.add('active');
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
    });

    slider.addEventListener('mouseleave', () => { isDown = false; });
    slider.addEventListener('mouseup', () => { isDown = false; });

    slider.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 2; 
        if (Math.abs(x - startX) > 5) {
            isDragging = true;
            e.preventDefault();
            slider.scrollLeft = scrollLeft - walk;
        }
    });

    slider.addEventListener('click', (e) => {
        if (isDragging) {
            e.preventDefault();
            e.stopImmediatePropagation();
        }
    }, true);
}

// Khởi tạo cho Menu chính khi vừa tải trang
window.onload = () => {
    showPopNotification("Hệ thống đã sẵn sàng!");
    initDragToScroll(document.getElementById('category-menu'));
};
</script>

</body>
</html>
